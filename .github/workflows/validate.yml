name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse scripts, scan public files, and validate local links
        shell: pwsh
        run: ./tests/Test-Repository.ps1

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse container shell scripts
        run: bash -n container/*.sh
